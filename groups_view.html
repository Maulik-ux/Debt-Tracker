{% extends "base_view.html" %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>Groups</h2>
    <a href="#" class="btn btn-primary" onclick="document.getElementById('new-group-modal').style.display='block';">+ New Group</a>
</div>

<div id="new-group-modal" style="display:none;" class="card">
    <h3>Create New Group</h3>
    <form action="{{ url_for('groups.create_group') }}" method="POST">
        <label>Group Name</label><br>
        <input type="text" name="group_name" required style="width: 100%; margin-bottom: 12px; box-sizing: border-box;"><br>
        <label>Add Members (usernames separated by comma)</label><br>
        <input type="text" name="additional_members" placeholder="e.g. Rivaan, John" style="width: 100%; margin-bottom: 12px; box-sizing: border-box;"><br>
        <button type="submit" class="btn btn-primary">Save Group</button>
    </form>
</div>

<div class="grid-2">
    {% for g in groups %}
    <div class="card group-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0;">{{ g.group_name }}</h3>
            <details>
                <summary style="cursor: pointer; font-weight: bold; color: var(--accent-glow);">&#8226;&#8226;&#8226;</summary>
                <div style="position: absolute; right: 20px; background: #1e293b; border: 1px solid var(--card-border); padding: 8px; border-radius: 6px; z-index: 10;">
                    <a href="{{ url_for('groups.manage_group', group_id=g.group_id) }}" style="color: white; font-size: 12px;">Manage Members</a>
                </div>
            </details>
        </div>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 0;">{{ g.member_count }} members</p>
        
        <div style="border-top: 1px solid var(--card-border); padding-top: 8px;">
            {% for m in g.members %}
            <div class="group-member-item">&#8226; {{ m }}</div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
