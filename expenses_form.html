{% extends "base_view.html" %}
{% block content %}
<h2>Add Expense</h2>

<div class="card" style="max-width: 600px;">
    <!-- Form to reload page on group selection change -->
    <form method="GET" action="{{ url_for('expenses.add_expense') }}" id="group_select_form" style="margin-bottom: 16px;">
        <label>Select Group</label><br>
        <select name="selected_group_id" onchange="this.form.submit()" style="width: 100%; padding: 8px; margin-top: 4px;">
            {% for g in groups %}
            <option value="{{ g.group_id }}" {% if g.group_id == current_group_id %}selected{% endif %}>{{ g.group_name }}</option>
            {% endfor %}
        </select>
    </form>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 20px;">

    <!-- Main Expense Form -->
    <form action="{{ url_for('expenses.add_expense') }}" method="POST">
        <input type="hidden" name="group_id" value="{{ current_group_id }}">

        <label>Title / Description</label><br>
        <input type="text" name="description" placeholder="e.g. Dinner" required style="width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box;"><br>

        <label>Amount ($)</label><br>
        <input type="number" step="0.01" name="amount" required style="width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box;"><br>

        <label>Category</label><br>
        <select name="category" style="width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box;">
            <option value="Food">Food</option>
            <option value="Taxi">Taxi</option>
            <option value="Other">Other</option>
        </select><br>

        <label>Paid by</label><br>
        <select name="paid_by" style="width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box;">
            {% for m in current_members %}
            <option value="{{ m.user_id }}">{{ m.username }}</option>
            {% endfor %}
        </select><br>

        <label>When</label><br>
        <input type="date" name="expense_date" value="{{ today }}" style="width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box;"><br>

        <label>Split Type</label><br>
        <select name="split_type" style="width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box;">
            <option value="Equally">Equally</option>
            <option value="By amount">By amount ($)</option>
            <option value="By percentage">By percentage (%)</option>
        </select><br>

        <label>Split Members (Group: {{ current_group_name }})</label><br>
        <div style="background: var(--bg-main); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 16px;">
            {% for m in current_members %}
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                <label style="cursor: pointer;">
                    <input type="checkbox" name="split_members" value="{{ m.user_id }}" checked> {{ m.username }}
                </label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" step="0.01" name="amount_{{ m.user_id }}" placeholder="Amount ($)" style="width: 90px; padding: 4px;">
                    <input type="number" step="0.01" name="pct_{{ m.user_id }}" placeholder="Pct (%)" style="width: 70px; padding: 4px;">
                </div>
            </div>
            {% endfor %}
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Expense</button>
    </form>
</div>
{% endblock %}
