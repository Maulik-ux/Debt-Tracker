{% extends "base_view.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto; text-align: center;">
    <h3>Confirm Deletion</h3>
    <p>Are you sure you want to delete this {{ item_type }}: <strong>{{ item_name }}</strong>?</p>
    <form method="POST">
        <button type="submit" class="btn btn-primary" style="background: red; border-color: red;">Delete</button>
        <a href="javascript:history.back()" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
