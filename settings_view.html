{% extends "base_view.html" %}
{% block content %}
<h2>Settings</h2>
<p style="color: var(--text-muted);">Manage your account details and security preferences.</p>

<div class="grid-2">
    <div class="card">
        <h3>Profile Details</h3>
        <form action="{{ url_for('settings.index') }}" method="POST">
            <input type="hidden" name="action" value="update_profile">

            <label>Username</label><br>
            <input type="text" name="username" value="{{ user.username }}" required style="width: 100%; margin-top: 4px; margin-bottom: 12px; box-sizing: border-box;"><br>

            <label>Email Address</label><br>
            <input type="email" name="email" value="{{ user.email }}" required style="width: 100%; margin-top: 4px; margin-bottom: 12px; box-sizing: border-box;"><br>

            <label>Preferred Currency Symbol</label><br>
            <select name="currency" style="width: 100%; margin-top: 4px; margin-bottom: 16px; box-sizing: border-box;">
                <option value="$" {% if user.currency == '$' %}selected{% endif %}>USD ($)</option>
                <option value="€" {% if user.currency == '€' %}selected{% endif %}>EUR (€)</option>
                <option value="£" {% if user.currency == '£' %}selected{% endif %}>GBP (£)</option>
                <option value="฿" {% if user.currency == '฿' %}selected{% endif %}>THB (฿)</option>
            </select><br>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>
        </form>
    </div>

    <div class="card">
        <h3>Change Password</h3>
        <form action="{{ url_for('settings.index') }}" method="POST">
            <input type="hidden" name="action" value="change_password">

            <label>Current Password</label><br>
            <input type="password" name="old_password" required style="width: 100%; margin-top: 4px; margin-bottom: 12px; box-sizing: border-box;"><br>

            <label>New Password</label><br>
            <input type="password" name="new_password" required style="width: 100%; margin-top: 4px; margin-bottom: 16px; box-sizing: border-box;"><br>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
